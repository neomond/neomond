<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <style>
    /* fade + rise for the text */
    .rise { animation: rise .8s cubic-bezier(.2,.7,.2,1) both; }
    .d1 { animation-delay: .1s; } .d2 { animation-delay: .35s; } .d3 { animation-delay: .6s; }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

    /* pulsing LIVE dot */
    .live { animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }

    /* racing line draws in, one sector after another */
    .sector { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .9s cubic-bezier(.4,0,.2,1) forwards; }
    .s1 { animation-delay: .9s; } .s2 { animation-delay: 1.8s; } .s3 { animation-delay: 2.7s; }
    @keyframes draw { to { stroke-dashoffset: 0; } }

    /* sector bars under the name fill in sync with the line */
    .bar { transform-box: fill-box; transform-origin: left; transform: scaleX(0); animation: fill .9s cubic-bezier(.4,0,.2,1) forwards; }
    .b1 { animation-delay: .9s; } .b2 { animation-delay: 1.8s; } .b3 { animation-delay: 2.7s; }
    @keyframes fill { to { transform: scaleX(1); } }

    /* car appears once the lap is drawn */
    .car { opacity: 0; animation: show .4s ease-out 3.6s forwards; }
    @keyframes show { to { opacity: 1; } }

    @media (prefers-reduced-motion: reduce) {
      .rise, .live, .sector, .bar, .car { animation: none; opacity: 1; transform: none; stroke-dashoffset: 0; }
    }
  </style>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1b1f27" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#0b0d11" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#0b0d11" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#0b0d11" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <path id="lap" d="M640 250 C 720 250, 740 120, 820 110 S 930 200, 990 150 S 1080 50, 1150 70"/>
  </defs>

  <rect width="1200" height="320" fill="#0b0d11"/>
  <rect width="1200" height="320" fill="url(#grid)"/>

  <!-- track -->
  <use href="#lap" fill="none" stroke="#2a303b" stroke-width="14" stroke-linecap="round"/>
  <!-- sectors -->
  <path class="sector s1" pathLength="1" d="M640 250 C 720 250, 740 120, 820 110" fill="none" stroke="#b56cff" stroke-width="4" stroke-linecap="round"/>
  <path class="sector s2" pathLength="1" d="M820 110 S 930 200, 990 150" fill="none" stroke="#2ee07a" stroke-width="4" stroke-linecap="round"/>
  <path class="sector s3" pathLength="1" d="M990 150 S 1080 50, 1150 70" fill="none" stroke="#f5c518" stroke-width="4" stroke-linecap="round"/>

  <!-- car lapping the track -->
  <g class="car">
    <circle r="18" fill="url(#glow)">
      <animateMotion dur="5s" begin="3.6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".45 0 .55 1">
        <mpath href="#lap"/>
      </animateMotion>
    </circle>
    <circle r="6" fill="#ffffff">
      <animateMotion dur="5s" begin="3.6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".45 0 .55 1">
        <mpath href="#lap"/>
      </animateMotion>
    </circle>
  </g>

  <rect width="760" height="320" fill="url(#fade)"/>

  <!-- text -->
  <g class="rise d1">
    <circle class="live" cx="62" cy="67" r="5.5" fill="#ff3b30"/>
    <text x="76" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="3" fill="#ff3b30">LIVE · ENGINEER PROFILE</text>
  </g>
  <text class="rise d2" x="56" y="140" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="1" fill="#f3f4f6">NAZRIN ATAYEVA</text>
  <text class="rise d3" x="56" y="182" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#9aa3b2">iOS engineer building AI &amp; perception systems</text>

  <!-- sector labels -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" letter-spacing="1.5">
    <rect x="56"  y="232" width="180" height="6" rx="3" fill="#232833"/>
    <rect x="252" y="232" width="180" height="6" rx="3" fill="#232833"/>
    <rect x="448" y="232" width="180" height="6" rx="3" fill="#232833"/>
    <rect class="bar b1" x="56"  y="232" width="180" height="6" rx="3" fill="#b56cff"/>
    <rect class="bar b2" x="252" y="232" width="180" height="6" rx="3" fill="#2ee07a"/>
    <rect class="bar b3" x="448" y="232" width="180" height="6" rx="3" fill="#f5c518"/>
    <g class="rise d3">
      <text x="56"  y="266" fill="#b56cff">S1</text><text x="84"  y="266" fill="#d6d9df">iOS · MOBILE</text>
      <text x="252" y="266" fill="#2ee07a">S2</text><text x="280" y="266" fill="#d6d9df">AI · AGENTS</text>
      <text x="448" y="266" fill="#f5c518">S3</text><text x="476" y="266" fill="#d6d9df">PERCEPTION</text>
    </g>
  </g>
</svg>
